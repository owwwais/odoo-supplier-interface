#odoo-supplier-app{--od-paper:light-dark(#fff,#24232a);--od-bg:light-dark(#f6f7f9,#1c1b22);--od-line:light-dark(#dedee5,#42404b);--od-ink:light-dark(#282d3c,#eeedf3);--od-muted:light-dark(#737786,#b6b3c2);--od-purple:light-dark(#714b67,#c595b6);--od-plum-bg:light-dark(#f3edf2,#423140);--od-teal:light-dark(#008b95,#62ccd1);--od-teal-bg:light-dark(#e8f5f5,#223d40);--od-green:light-dark(#288360,#79cdaa);--od-green-bg:light-dark(#eaf5ef,#253d33);--od-red:light-dark(#b74742,#f4a69e);--od-red-bg:light-dark(#fff0ee,#432b2a);--od-amber:light-dark(#ad711b,#eabe75);--od-amber-bg:light-dark(#fff6e6,#443724);font-family:OdooArabic,Tahoma,Arial,sans-serif;font-size:14px;line-height:1.65;color:var(--od-ink);background:var(--od-bg);direction:rtl;text-align:right;position:relative;isolation:isolate;min-width:0;overflow-wrap:break-word}
#odoo-supplier-app *{box-sizing:border-box}
#odoo-supplier-app button,#odoo-supplier-app input,#odoo-supplier-app select,#odoo-supplier-app textarea{font:inherit}
#odoo-supplier-app button{cursor:pointer}
#odoo-supplier-app button:disabled{cursor:not-allowed;opacity:.52}
#odoo-supplier-app input,#odoo-supplier-app select,#odoo-supplier-app textarea{color:var(--od-ink);background:var(--od-paper);border:1px solid var(--od-line);border-radius:4px;min-width:0;padding:8px 10px;width:100%;accent-color:var(--od-teal)}
#odoo-supplier-app input:focus,#odoo-supplier-app select:focus,#odoo-supplier-app textarea:focus{outline:2px solid var(--od-teal);outline-offset:1px}
#odoo-supplier-app input[readonly],#odoo-supplier-app select:disabled,#odoo-supplier-app textarea[readonly]{background:var(--od-bg)}
#odoo-supplier-app input[type=checkbox]{width:16px;height:16px;margin:0;flex:none}
#odoo-supplier-app input[type=file]{font-size:12px}
#odoo-supplier-app h1,#odoo-supplier-app h2,#odoo-supplier-app h3,#odoo-supplier-app p{margin:0}
#odoo-supplier-app h1{font-size:22px;font-weight:500;line-height:1.55}
#odoo-supplier-app h2{font-size:15px;font-weight:500}
#odoo-supplier-app h3{font-size:14px;font-weight:500}
#odoo-supplier-app svg{flex:none;vertical-align:middle}
#odoo-supplier-app .od-flex{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#odoo-supplier-app .od-spread{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
#odoo-supplier-app .od-muted{color:var(--od-muted)}
#odoo-supplier-app .od-small{font-size:12px}
#odoo-supplier-app .od-ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
#odoo-supplier-app .od-link{border:0;padding:0;background:transparent;color:var(--od-teal);text-align:right}
#odoo-supplier-app .od-button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:6px 12px;border-radius:4px;border:1px solid var(--od-line);color:var(--od-ink);background:var(--od-paper);white-space:nowrap}
#odoo-supplier-app .od-button:hover{background:var(--od-bg)}
#odoo-supplier-app .od-primary{background:var(--od-purple);border-color:var(--od-purple);color:light-dark(#fff,#211820)}
#odoo-supplier-app .od-primary:hover{filter:brightness(.95);background:var(--od-purple)}
#odoo-supplier-app .od-subtle{background:transparent;border-color:transparent}
#odoo-supplier-app .od-icon-button{padding:6px 9px}
#odoo-supplier-app .od-danger{color:var(--od-red)}
#odoo-supplier-app .od-header{display:flex;align-items:center;gap:18px;min-height:61px;padding:0 20px;background:var(--od-paper);border-top:2px solid var(--od-purple);border-bottom:1px solid var(--od-line);position:relative;z-index:15}
#odoo-supplier-app .od-brand{display:flex;align-items:center;gap:8px;white-space:nowrap;font-size:17px}
#odoo-supplier-app .od-logo{display:grid;place-items:center;width:30px;height:30px;color:light-dark(#fff,#fff);background:#8d7187;border-radius:2px}
#odoo-supplier-app .od-navigation{display:flex;align-items:stretch;gap:5px;flex:1;min-width:0;align-self:stretch}
#odoo-supplier-app .od-nav-wrap{position:relative;display:flex;min-width:0;align-items:center}
#odoo-supplier-app .od-nav-button{display:flex;align-items:center;gap:5px;justify-content:center;border:0;border-bottom:3px solid transparent;border-radius:0;background:transparent;color:var(--od-ink);padding:10px 8px;height:100%;font-size:13px;white-space:nowrap}
#odoo-supplier-app .od-nav-button.od-active{border-bottom-color:var(--od-teal);color:var(--od-teal);background:var(--od-teal-bg)}
#odoo-supplier-app .od-shell-label{display:flex;align-items:center;padding:0 5px;color:var(--od-muted);font-size:12px;white-space:nowrap}
#odoo-supplier-app .od-account{display:flex;align-items:center;gap:8px;flex:none}
#odoo-supplier-app .od-avatar{width:29px;height:29px;border-radius:5px;display:inline-grid;place-items:center;flex:none;color:var(--od-purple);background:var(--od-plum-bg);font-size:12px}
#odoo-supplier-app .od-account .od-avatar{background:#91b329;color:white}
#odoo-supplier-app .od-dropdown{position:absolute;top:calc(100% + 2px);right:0;width:308px;max-width:calc(100vw - 30px);padding:7px;background:var(--od-paper);border:1px solid var(--od-line);border-radius:5px;box-shadow:0 10px 24px #0002;z-index:30}
#odoo-supplier-app .od-dropdown button{display:flex;align-items:center;gap:9px;width:100%;padding:9px 11px;border:0;border-radius:3px;background:transparent;color:var(--od-ink);text-align:right;font-size:13px}
#odoo-supplier-app .od-dropdown button:hover,#odoo-supplier-app .od-dropdown button.od-selected{background:var(--od-teal-bg);color:var(--od-teal)}
#odoo-supplier-app .od-dropdown .od-count{margin-inline-start:auto}
#odoo-supplier-app .od-menu-rule{height:1px;background:var(--od-line);margin:6px 3px}
#odoo-supplier-app .od-count{display:inline-grid;place-items:center;min-width:24px;min-height:22px;border-radius:4px;background:var(--od-bg);color:var(--od-muted);padding:0 5px;font-size:12px}
#odoo-supplier-app .od-context{display:flex;align-items:center;gap:10px;padding:7px 22px;background:var(--od-paper);color:var(--od-muted);font-size:11px;border-bottom:1px solid var(--od-line)}
#odoo-supplier-app .od-context .od-demo{margin-inline-start:auto;display:flex;align-items:center;gap:5px}
#odoo-supplier-app .od-demo-dot{width:5px;height:5px;background:var(--od-amber);border-radius:50%}
#odoo-supplier-app .od-content{padding:22px}
#odoo-supplier-app .od-page-header{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
#odoo-supplier-app .od-page-header p{margin-top:3px;color:var(--od-muted);font-size:12px}
#odoo-supplier-app .od-filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
#odoo-supplier-app .od-filters select{width:auto;max-width:220px;font-size:12px;min-height:36px}
#odoo-supplier-app .od-search{display:flex;align-items:center;gap:7px;min-width:185px;flex:1;max-width:370px;border:1px solid var(--od-line);border-radius:4px;padding:0 10px;background:var(--od-paper);color:var(--od-muted)}
#odoo-supplier-app .od-search input{border:0;padding:6px 0;font-size:12px;outline-offset:0}
#odoo-supplier-app .od-view-switch{display:flex;align-items:center;margin-inline-start:auto;gap:3px;border:1px solid var(--od-line);padding:2px;border-radius:4px;background:var(--od-paper)}
#odoo-supplier-app .od-view-switch button{background:transparent;border:0;color:var(--od-muted);padding:5px 8px;display:flex;align-items:center;gap:5px;border-radius:3px;font-size:12px}
#odoo-supplier-app .od-view-switch button[aria-pressed=true]{background:var(--od-plum-bg);color:var(--od-purple)}
#odoo-supplier-app .od-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
#odoo-supplier-app .od-stat{display:block;text-align:right;background:var(--od-paper);border:1px solid var(--od-line);border-radius:5px;padding:17px 18px;color:var(--od-ink)}
#odoo-supplier-app .od-stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--od-muted);font-size:12px;gap:6px}
#odoo-supplier-app .od-stat-value{font-family:OdooArabic,sans-serif;font-size:29px;line-height:1.5;font-weight:500;display:block;margin:9px 0 2px;font-variant-numeric:tabular-nums}
#odoo-supplier-app .od-stat-detail{display:block;color:var(--od-muted);font-size:11px}
#odoo-supplier-app .od-grid-two{display:grid;grid-template-columns:1fr 1.22fr;gap:18px;align-items:start}

let tabs=[['requirements','المتطلبات'],['files','مستندات التقديم'],['notes','الملاحظات والمتابعة']];if(r.stage==='submitted')tabs.push(['submission','التسليم والنتيجة']);
screen.innerHTML=pageHeader(state.isNew?'طلب جديد':esc(r.name),state.isNew?'إنشاء قائمة موردين أو دعوة تأهيل مسبق':'<span class="od-ltr">'+r.ref+'</span> · '+esc(COMPANIES[r.company]),acts)+
(state.error?'<div class="od-alert od-error" role="alert">'+icon('circle-alert')+esc(state.error)+'</div>':'')+
'<div class="od-form-layout"><div class="od-form-main"><div class="od-stepper" aria-label="مراحل الدعوة">'+STAGES.map((s,i)=>'<div class="od-step '+(i===index&&!r.disregarded?'od-current':i<index?'od-done':'')+'" '+(i===index?'aria-current="step"':'')+'><b>'+n(i+1)+'</b><span>'+s.name+'</span></div>').join('')+'</div>'+
(!state.isNew?'<div class="od-action-strip">'+next+(!ro?button('صرف النظر','disregard','od-subtle od-danger'):'')+'<span class="od-grow">'+deadlineBadge(r)+'</span></div>':'')+
(r.disregarded?'<div class="od-alert">'+icon('circle-slash')+'<span>اعتمد مدير القسم صرف النظر. '+esc(r.disregardNote)+'</span></div>':'')+
'<section class="od-panel"><div class="od-fields"><div class="od-field od-wide-field"><span>نوع الطلب <b class="od-required">*</b></span><div class="od-type-options">'+Object.entries(TYPES).map(([k,v])=>'<button type="button" class="'+(r.type===k?'od-chosen':'')+'" aria-pressed="'+(r.type===k)+'" data-action="type" data-value="'+k+'" '+(ro?'disabled':'')+'>'+v+'</button>').join('')+'</div></div>'+
field('اسم الدعوة','name',r.name,true,'text',true,ro)+
field('الجهة الطارحة','partner',r.partner,true,'text',false,ro)+
'<label class="od-field"><span>الشركة المقدمة <b class="od-required">*</b></span><select data-field="company" '+(ro?'disabled':'')+'>'+Object.entries(COMPANIES).map(([k,v])=>'<option value="'+k+'"'+selected(k,r.company)+'>'+v+'</option>').join('')+'</select></label>'+
field('موعد التسليم','deadline',r.deadline,true,'datetime-local',false,ro,'التاريخ والوقت بتوقيت الرياض')+field('رقم المرجع لدى الجهة','reference',r.reference,false,'text',false,ro)+
field('المسؤولون عن التقديم','ownersText',r.owners.join('، '),true,'text',true,ro,'افصل بين الأسماء بفاصلة')+
field('رابط الدعوة أو منصة الجهة','source',r.source,false,'url',true,ro)+'</div>'+
'<div class="od-tabs" role="tablist" aria-label="تفاصيل الطلب">'+tabs.map(([k,l])=>'<button class="od-tab" id="od-tab-'+k+'" role="tab" aria-controls="od-form-panel" aria-selected="'+(state.tab===k)+'" data-action="tab" data-value="'+k+'">'+l+(k==='requirements'?'<span class="od-count">'+n(r.requirements.length)+'</span>':'')+'</button>').join('')+'</div><div class="od-tab-content" id="od-form-panel" role="tabpanel" aria-labelledby="od-tab-'+state.tab+'">'+(state.tab==='requirements'?renderRequirements(r,ro):state.tab==='files'?renderFiles(r,ro):state.tab==='submission'?renderSubmission(r):renderNotes(r,ro))+'</div></section></div>'+
'<aside class="od-aside"><h2>سجل المتابعة</h2><div class="od-flex" style="margin-bottom:17px">'+button(icon('message-square')+'ملاحظة','add-note','',state.isNew?'disabled':'')+button(icon('clock')+'نشاط','activity','',state.isNew?'disabled':'')+'</div>'+(state.isNew?'<p class="od-small od-muted">يبدأ سجل المتابعة بعد حفظ الطلب.</p>':r.history.slice().reverse().slice(0,4).map(h=>'<div class="od-aside-note"><small>'+esc(h.date)+'</small><p>'+esc(h.text)+'</p></div>').join(''))+'<div class="od-overview-note" style="margin:12px 0 0;padding:12px 0 0"><span>المتطلبات</span><span>'+n(r.requirements.filter(q=>q.ready).length)+' / '+n(r.requirements.length)+'</span></div></aside></div>';}
function renderLegacy(){screen.innerHTML=pageHeader(state.legacyTitle||'جميع المنافسات','مسار المنافسات',button('فتح تبويب الموردين والتأهيل','navigate','od-primary','data-value="dashboard"'))+'<section class="od-panel"><div class="od-empty"><h2>قوائم الموردين والتأهيل لها تبويب مستقل الآن</h2><p>استخدم التبويب المجاور لفتح لوحة المؤشرات وصفحات المراحل.</p></div></section>';}
function render(){renderMenu();if(state.page==='dashboard')renderDashboard();else if(state.page==='form')renderForm();else if(state.page==='legacy')renderLegacy();else renderRecords();root.querySelector('#od-new-trigger').classList.toggle('od-active',state.page!=='legacy');root.querySelector('#od-old-trigger').classList.toggle('od-active',state.page==='legacy');refreshIcons();}
function requestRoute(action){if(state.page==='form'&&state.dirty){resumeNavigation=action;openModal('leave');}else action();}
function navigate(value){closeMenus();state.error='';state.search='';state.onlyOverdue=false;state.dirty=false;state.page=value==='dashboard'?'dashboard':'records';state.stage=value==='dashboard'?'all':value;render();}
function newRecord(){state.isNew=true;state.dirty=false;state.error='';state.tab='requirements';state.draft={id:null,ref:'',name:'',type:state.type==='all'?'supplier_list':state.type,partner:'',company:state.company==='all'?'kaizen':state.company,owners:[USERS[0]],deadline:'',reference:'',source:'',stage:'study',requirements:[],created:'2026-09-14',result:'',resultNote:'',disregarded:false,reason:'',disregardNote:'',files:[],notes:'',history:[],submittedAt:'',deadlineSnapshot:'',proof:''};state.page='form';render();}
function openRecord(id){state.draft=clone(records.find(r=>r.id===Number(id)));state.isNew=false;state.dirty=false;state.error='';state.tab='requirements';state.page='form';closeMenus();render();}
function validate(r){if(!r.name.trim())return 'أدخل اسم الدعوة قبل الحفظ.';if(!r.partner)return 'أدخل اسم الجهة الطارحة.';if(!r.company)return 'اختر الشركة المقدمة.';if(!r.deadline||isNaN(parseDate(r.deadline)))return 'حدد تاريخ ووقت التسليم.';if(!r.owners.length)return 'حدد مسؤولاً واحداً على الأقل عن التقديم.';if(r.source&&!/^https?:\/\/[^\s]+$/i.test(r.source))return 'اكتب رابطاً يبدأ بـ https:// أو http://.';if(r.requirements.some(q=>!q.name.trim()))return 'أكمل أسماء بنود المتطلبات أو احذف البنود الفارغة.';return '';}
function log(text){state.draft.history.push({text,date:'١٤ سبتمبر · ٩:٣٠ ص'});}
function commit(message){let r=state.draft,error=validate(r);if(error){state.error=error;render();return false;}if(r.stage==='ready'&&progress(r)<100)r.stage='preparing';if(state.isNew){r.id=Math.max(...records.map(x=>x.id))+1;r.ref=(r.type==='supplier_list'?'SL':'PQ')+'/2026/'+String(r.id).padStart(4,'0');log('إنشاء سجل الدعوة وإسناده إلى '+r.owners.join('، ')+'.');records.push(clone(r));state.isNew=false;}else{records[records.findIndex(x=>x.id===r.id)]=clone(r);}state.error='';state.dirty=false;render();if(message)toast(message);return true;}
function formError(s){state.error=s;render();}
function openModal(kind){modalType=kind;let r=state.draft,title='',body='',label='';
if(kind==='submit'){title='توثيق التسليم';label='تأكيد تم التسليم';body='<div class="od-alert">'+icon('info')+'سجّل الإرسال الفعلي بعد رفع الملفات عبر منصة الجهة.</div><label class="od-field"><span>تاريخ ووقت الإرسال الفعلي <b class="od-required">*</b></span><input type="datetime-local" id="od-submitted-at" required dir="ltr"><small>بتوقيت الرياض</small></label><label class="od-field"><span>رقم أو مرجع إثبات التسليم</span><input id="od-proof" placeholder="رقم الطلب أو إشعار الاستلام"></label><label class="od-field"><span>أو إرفاق إثبات التسليم</span><input type="file" id="od-proof-file"></label>';}
else if(kind==='disregard'){title='اعتماد صرف النظر';label='اعتماد صرف النظر';body='<label class="od-field"><span>سبب صرف النظر <b class="od-required">*</b></span><select id="od-reason"><option value="">اختر السبب</option>'+options(REASONS,'')+'</select></label><label class="od-field"><span>تفصيل السبب</span><textarea id="od-reason-note" rows="3" placeholder="يلزم التفصيل عند اختيار سبب آخر"></textarea></label><p class="od-small od-muted">سيُحفظ القرار باسم مدير القسم في سجل المتابعة.</p>';}
else if(kind==='result'){title='تسجيل نتيجة الجهة';label='حفظ النتيجة';body='<label class="od-field"><span>النتيجة <b class="od-required">*</b></span><select id="od-result"><option value="pending"'+selected('pending',r.result)+'>بانتظار الرد</option><option value="qualified"'+selected('qualified',r.result)+'>مقبول</option><option value="not_qualified"'+selected('not_qualified',r.result)+'>غير مقبول</option></select></label><label class="od-field"><span>ملاحظة الجهة أو سبب عدم القبول</span><textarea id="od-result-note" rows="3" placeholder="دوّن السبب إذا أفصحت عنه الجهة">'+esc(r.resultNote)+'</textarea></label>';}
else if(kind==='note'){title='إضافة ملاحظة';label='حفظ الملاحظة';body='<label class="od-field"><span>الملاحظة</span><textarea id="od-history-note" rows="4" placeholder="أضف تحديثاً لفريق العمل..."></textarea></label>';}
else if(kind==='activity'){title='جدولة نشاط';label='حفظ النشاط';body='<label class="od-field"><span>النشاط</span><input id="od-activity-name" placeholder="مثال: مراجعة الملفات مع المسؤول"></label><label class="od-field"><span>تاريخ الاستحقاق</span><input id="od-activity-date" type="date"></label><label class="od-field"><span>المسؤول</span><select id="od-activity-owner">'+options(USERS,USERS[0])+'</select></label>';}
else if(kind==='leave'){title='مغادرة الطلب';label='تجاهل التغييرات';body='<p>توجد تغييرات لم تُحفظ. هل تريد مغادرة الطلب؟</p>';}
root.querySelector('#od-modal-host').innerHTML='<div class="od-modal-overlay"><section class="od-modal" role="dialog" aria-modal="true" aria-labelledby="od-dialog-title"><header class="od-modal-header"><h2 id="od-dialog-title">'+title+'</h2>'+button(icon('x'),'close-modal','od-subtle od-icon-button','aria-label="إغلاق"')+'</header><div class="od-modal-body"><div id="od-modal-error" role="alert" class="od-alert od-error" hidden></div>'+body+'</div><footer class="od-modal-footer">'+button(label,'confirm-modal','od-primary')+button('إلغاء','close-modal')+'</footer></section></div>';refreshIcons();root.querySelector('.od-modal input,.od-modal textarea,.od-modal select,.od-modal button').focus();}
function closeModal(){root.querySelector('#od-modal-host').innerHTML='';modalType='';}
function confirmModal(){let r=state.draft,get=id=>root.querySelector('#'+id).value,err='';
if(modalType==='leave'){let action=resumeNavigation;resumeNavigation=null;state.dirty=false;closeModal();if(action)action();else navigate('all');return;}
if(modalType==='submit'){let dt=get('od-submitted-at'),proof=get('od-proof').trim(),file=root.querySelector('#od-proof-file').files[0];if(!dt)err='حدد وقت الإرسال الفعلي.';else if(parseDate(dt)>REF_TIME)err='لا يمكن أن يكون وقت الإرسال الفعلي في المستقبل.';else if(!proof&&!file)err='أدخل مرجع إثبات التسليم أو أرفق الإثبات.';else if(progress(r)!==100)err='لا يمكن توثيق التسليم قبل استيفاء جميع المتطلبات.';else{r.stage='submitted';r.submittedAt=dt;r.deadlineSnapshot=r.deadline;r.proof=proof||(file&&file.name);r.result='pending';if(file)r.files.push({name:file.name,from:'إثبات التسليم'});log('توثيق التسليم الفعلي. النتيجة بانتظار رد الجهة.');state.tab='submission';}}
if(modalType==='disregard'){let reason=get('od-reason'),note=get('od-reason-note').trim();if(!reason)err='اختر سبب صرف النظر.';else if(reason==='سبب آخر'&&!note)err='اكتب تفصيل السبب الآخر.';else{r.disregarded=true;r.reason=reason;r.disregardNote=note;log('اعتماد مدير القسم صرف النظر. السبب: '+reason+(note?'، '+note:''));}}
if(modalType==='result'){r.result=get('od-result');r.resultNote=get('od-result-note').trim();log('تحديث نتيجة الجهة إلى '+({pending:'بانتظار الرد',qualified:'مقبول',not_qualified:'غير مقبول'}[r.result])+'.');}
if(modalType==='note'){let note=get('od-history-note').trim();if(!note)err='اكتب الملاحظة أولاً.';else log(note);}
if(modalType==='activity'){let title=get('od-activity-name').trim(),dt=get('od-activity-date');if(!title||!dt)err='أدخل اسم النشاط وتاريخ استحقاقه.';else log('نشاط: '+title+' · المسؤول '+get('od-activity-owner')+' · الاستحقاق '+dateLabel(dt+'T12:00'));}
if(err){let e=root.querySelector('#od-modal-error');e.textContent=err;e.hidden=false;return;}closeModal();commit('تم حفظ التحديث');}
root.addEventListener('click',function(e){let b=e.target.closest('[data-action]');if(!b||b.disabled)return;let a=b.dataset.action,v=b.dataset.value,r=state.draft;
if(a==='new-menu'||a==='old-menu'){let k=a==='new-menu'?'new':'old',el=root.querySelector('#od-'+k+'-menu'),show=el.hidden;closeMenus();el.hidden=!show;root.querySelector('#od-'+k+'-trigger').setAttribute('aria-expanded',String(show));return;}
if(a==='navigate'){requestRoute(()=>navigate(v));return;}if(a==='legacy'){requestRoute(()=>{closeMenus();state.page='legacy';state.legacyTitle=v;render();});return;}if(a==='new'){requestRoute(newRecord);return;}if(a==='open'){requestRoute(()=>openRecord(b.dataset.id));return;}
if(a==='late'){requestRoute(()=>{navigate('open');state.onlyOverdue=true;render();});return;}if(a==='calendar'){requestRoute(()=>{navigate('all');state.view='calendar';render();});return;}
if(a==='view'){state.view=v;render();return;}if(a==='month'){state.month+=Number(b.dataset.delta);if(state.month<0){state.month=11;state.year--;}if(state.month>11){state.month=0;state.year++;}render();return;}
if(a==='back'){requestRoute(()=>navigate('all'));return;}if(a==='close-modal'){closeModal();return;}if(a==='confirm-modal'){confirmModal();return;}
if(a==='upload-files'){root.querySelector('#od-document-files').click();return;}if(a==='tab'){state.tab=v;render();return;}if(a==='type'){r.type=v;state.dirty=true;render();return;}if(a==='save'){let error=validate(r);if(error){formError(error);return;}if(!state.isNew)log('حفظ تعديلات بيانات الدعوة.');commit('تم حفظ الطلب');return;}
if(a==='template'){let added=0;templateNames.forEach((name,i)=>{if(!r.requirements.some(q=>q.code==='common-'+i||q.name===name)){r.requirements.push({id:uid(),code:'common-'+i,name,ready:false,owner:r.owners[0]||USERS[0],file:''});added++;}});if(r.type==='prequalification'&&!r.requirements.some(q=>q.code==='prequal-financial')){r.requirements.push({id:uid(),code:'prequal-financial',name:'القوائم المالية المدققة حسب طلب الجهة',ready:false,owner:r.owners[0]||USERS[0],file:''});added++;}state.dirty=true;render();toast(added?'أضيف '+n(added)+' بنود من القالب. راجعها حسب الدعوة.':'بنود القالب موجودة بالفعل؛ لم تُكرر.');return;}
if(a==='add-req'){r.requirements.push({id:uid(),name:'',ready:false,owner:r.owners[0]||USERS[0],file:''});state.dirty=true;render();let inputs=root.querySelectorAll('[data-req-name]');inputs[inputs.length-1].focus();return;}if(a==='remove-req'){r.requirements=r.requirements.filter(q=>q.id!==b.dataset.id);state.dirty=true;render();return;}
if(a==='advance'){let error=validate(r);if(error){formError(error);return;}if(!r.requirements.length){formError('أضف قائمة المتطلبات قبل بدء التجهيز.');return;}if(r.stage==='study'){r.stage='preparing';log('اعتماد التقديم وبدء تجهيز الملفات.');commit('بدأ تجهيز الملفات');}else if(r.stage==='preparing'){if(progress(r)!==100){formError('لا يمكن الانتقال إلى الجاهزية. يتبقى '+n(r.requirements.filter(q=>!q.ready).length)+' متطلبات غير مستوفاة.');return;}r.stage='ready';log('اكتمال جميع المتطلبات. الطلب جاهز للتسليم.');commit('الطلب جاهز للتسليم');}return;}
if(a==='submit'){let error=validate(r);if(error){formError(error);return;}if(progress(r)!==100){formError('أكمل جميع المتطلبات قبل توثيق التسليم.');return;}openModal('submit');return;}if(a==='disregard'){let error=validate(r);if(error){formError(error);return;}openModal('disregard');return;}if(a==='result'){openModal('result');return;}if(a==='add-note'){openModal('note');return;}if(a==='activity'){openModal('activity');return;}
});
root.addEventListener('input',function(e){let el=e.target;if(el.dataset.filter==='search'){let pos=el.selectionStart;state.search=el.value;renderRecords();refreshIcons();let inp=root.querySelector('[data-filter=search]');inp.focus();inp.setSelectionRange(pos,pos);return;}if(!state.draft)return;if(el.dataset.field){if(el.dataset.field==='ownersText')state.draft.owners=el.value.split(/[,،]/).map(x=>x.trim()).filter(Boolean);else state.draft[el.dataset.field]=el.value;state.dirty=true;}if(el.dataset.reqName){state.draft.requirements.find(q=>q.id===el.dataset.reqName).name=el.value;state.dirty=true;}});
root.addEventListener('change',function(e){let el=e.target;if(el.dataset.filter){state[el.dataset.filter]=el.value;render();return;}let r=state.draft;if(!r)return;if(el.dataset.field){if(el.dataset.field==='ownersText')r.owners=el.value.split(/[,،]/).map(x=>x.trim()).filter(Boolean);else r[el.dataset.field]=el.value;state.dirty=true;}if(el.dataset.owner){r.owners=Array.from(root.querySelectorAll('[data-owner]:checked')).map(x=>x.dataset.owner);state.dirty=true;}if(el.dataset.reqReady){r.requirements.find(q=>q.id===el.dataset.reqReady).ready=el.checked;if(r.stage==='ready'&&progress(r)<100)r.stage='preparing';state.dirty=true;state.error='';render();}if(el.dataset.reqOwner){r.requirements.find(q=>q.id===el.dataset.reqOwner).owner=el.value;state.dirty=true;}if(el.dataset.reqFile){r.requirements.find(q=>q.id===el.dataset.reqFile).file=el.files[0]?el.files[0].name:'';state.dirty=true;render();}if(el.hasAttribute('data-files')){r.files.push(...Array.from(el.files).map(f=>({name:f.name,from:'مستند عام'})));state.dirty=true;render();}});
document.addEventListener('click',e=>{if(!root.contains(e.target)||!e.target.closest('.od-nav-wrap'))closeMenus();});
root.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeMenus();}if(e.key==='Tab'&&modalType){let els=Array.from(root.querySelectorAll('.od-modal button,.od-modal input,.od-modal textarea,.od-modal select')).filter(x=>!x.disabled);let first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
/* Handoff: this is a front-end design prototype with illustrative data, held in memory.
   Reimplement all constraints, record rules, uploads, audit trails and scheduled alerts
   on the Odoo server. No actual Odoo data, files, notifications or accounts are accessed.
   State keys: study > preparing > ready > submitted; disregard is a separate flag.
   Result is assigned only after actual submission with proof and a deadline snapshot.
   Keep approved Odoo company + assignment permissions on requirements and attachments. */
render();
})();
